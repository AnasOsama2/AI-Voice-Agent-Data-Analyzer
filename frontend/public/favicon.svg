<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5" />

  <!-- Outer Pulse Circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Animated Sound Waves (Static Vector) -->
  <g filter="url(#glow)">
    <rect x="14" y="26" width="3.5" height="12" rx="1.75" fill="#6366f1" opacity="0.7" />
    <rect x="21" y="20" width="3.5" height="24" rx="1.75" fill="#818cf8" />
    <rect x="28" y="14" width="3.5" height="36" rx="1.75" fill="url(#waveGrad)" />
    <rect x="35" y="18" width="3.5" height="28" rx="1.75" fill="#a855f7" />
    <rect x="42" y="24" width="3.5" height="16" rx="1.75" fill="#c084fc" />
    <rect x="49" y="28" width="3.5" height="8" rx="1.75" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Data Sparkle / AI Node -->
  <circle cx="48" cy="16" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="16" cy="46" r="2" fill="#a855f7" opacity="0.8" />
</svg>
